name: Build exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa pillow pyinstaller
      - run: pyinstaller --onefile --windowed --name LuaRunner lua_runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: LuaRunner
          path: dist/LuaRunner.exe
